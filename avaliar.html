<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Checklist completo (AIDP)</title>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/avaliar.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/gerarPDF.js"></script>
</head>
<body>
  <main class="container">
    <section id="checklistSection" class="card" style="margin-top:18px">
      <div id="area-relatorio">
        <div class="section-title">
          <h2>Checklist completo (AIDP)</h2>
          <span class="small">Preencha as etapas da avaliação clínica</span>
        </div>

        <form id="checklistForm" onsubmit="return false;">

          <div class="row">
            <div style="flex:1">
              <label for="nome">Nome da criança / identificação</label>
              <input id="nome" type="text" placeholder="Ex: João" />
            </div>
            <div style="width:140px">
              <label for="idade">Idade</label>
              <input id="idade" type="number" placeholder="Ex: 2,8" />
            </div>
          </div>

          <h3>Sinais de Perigo Geral</h3>
          <div class="checkboxes" aria-label="Sinais de perigo geral">
            <label><input type="checkbox" name="danger" value="convulsao"> Convulsões</label>
            <label><input type="checkbox" name="danger" value="inconsiencia"> Inconsciência / letargia</label>
            <label><input type="checkbox" name="danger" value="incapaz_beber"> Incapaz de beber ou mamar</label>
            <label><input type="checkbox" name="danger" value="sinais_choque"> Sinais de choque (pulso fraco/frio)</label>
          </div>

          <h3>A Tosse ou a Dificuldade de Respirar</h3>
          <div class="row">
            <div style="flex:1">
              <label for="cough">A criança tem tosse ou dificuldade para respirar?</label>
              <select id="cough">
                <option value="no">Não</option>
                <option value="yes">Sim</option>
              </select>
            </div>
            <div style="width:140px">
              <label for="duration_cough">Há quanto tempo?</label>
              <input id="duration_cough" type="text" placeholder="ex: 2 dias" />
            </div>
          </div>

          <div class="checkboxes" style="margin-top:6px">
            <label><input type="checkbox" name="resp" value="qualquer_sinal_perigo_Tosse"> Qualquer sinal geral de perigo</label>
            <label><input type="checkbox" name="resp" value="tiragem_subcostal_Tosse"> Tiragem subcostal</label>
            <label><input type="checkbox" name="resp" value="estridor_descanso"> Estridor em repouso</label>
            <label><input type="checkbox" name="resp" value="respiracao_rapida"> Respiração rápida (usar campo FR)</label>
            <label><input type="checkbox" name="resp" value="nenhum sinal acima"> Nenhum sinal acima</label>
          </div>

          <div class="row" style="margin-top:8px">
            <div style="flex:1">
              <label for="rr">Frequência respiratória / min</label>
              <input id="rr" type="number" placeholder="ex: 50" />
            </div>
            <div style="width:140px">
              <label for="o2">Sat O₂ (%)</label>
              <input id="o2" type="number" placeholder="ex: 95" />
            </div>
          </div>

          <h3>A Sibilância</h3>
          <div class="checkboxes">
            <label><input type="checkbox" name="sibilancia_det" value="letargia_demais"> Letargia ou sempre agitada</label>
            <label><input type="checkbox" name="sibilancia_det" value="agitacao_normal"> Periodos de agitação normal</label>
            <label><input type="checkbox" name="sibilancia_det" value="estridor"> Estridor em repouso</label>
            <label><input type="checkbox" name="sibilancia_det" value="tiragem_universal"> Tiragem universal</label>
            <label><input type="checkbox" name="sibilancia_det" value="tiragem_subcostal_Sibi"> Tiragem subcostal</label>
            <label><input type="checkbox" name="sibilancia_det" value="fala_incompleta"> Fala frases incompletas</label>
            <label><input type="checkbox" name="sibilancia_det" value="choro_curto"> Choro curto/ Não consegue chorar</label>
            <label><input type="checkbox" name="sibilancia_det" value="choro_entrecortado"> Choro entrecortado</label>
            <label><input type="checkbox" name="sibilancia_det" value="sat_low"> Sat O₂ ≤ 90%</label>
            <label><input type="checkbox" name="sibilancia_det" value="sat_mid"> Sat O₂ 91% a 95%</label>
            <label><input type="checkbox" name="sibilancia_det" value="sat_high"> Sat O₂ ≥ 95%</label>
            <label><input type="checkbox" name="sibilancia_det" value="nenhum sinal acima_sib"> Nenhum sinal acima</label>
          </div>

          <h3>A Diarreia</h3>
          <div class="row">
            <div style="flex:1">
              <label for="diarrhea">A criança está com diarreia?</label>
              <select id="diarrhea">
                <option value="no">Não</option>
                <option value="yes">Sim</option>
              </select>
            </div>
            <div style="width:140px">
              <label for="duration_diarr">Há quanto tempo?</label>
              <input id="duration_diarr" type="text" placeholder="ex: 3 dias" />
            </div>
          </div>

          <div class="checkboxes" style="margin-top:6px">
            <label><input type="checkbox" name="diarr" value="letargica_diarr">Letárgica ou inconsciente</label>
              <label><input type="checkbox" name="diarr" value="olhos_fundos">Olhos fundos</label>
              <label><input type="checkbox" name="diarr" value="nao_bebe">Não consegue beber ou bebe mal</label>
              <label><input type="checkbox" name="diarr" value="prega_muito_lenta">Sinal da prega</label>
              <label><input type="checkbox" name="diarr" value="inquieta">Inquieta ou irritada</label>
              <label><input type="checkbox" name="diarr" value="bebe_avido">Bebe avidamente, com sede</label>
              <label><input type="checkbox" name="diarr" value="nenhum sinal acima_diarr"> Nenhum sinal acima</label>
              <label><input type="checkbox" name="diarr" value="sangue_nas_fezes">Sangue nas fezes</label>
              <label><input type="checkbox" name="diarr" value="com_desidratacao">Com desidratação</label>
              <label><input type="checkbox" name="diarr" value="sem_desidratacao">Sem desidratação</label>
          </div>

          <h3>Febre</h3>
          <div class="row">
            <div style="flex:1">
              <label for="fever">A criança tem febre?</label>
              <select id="fever">
                <option value="no">Não</option>
                <option value="yes">Sim</option>
              </select>
            </div>
            <div style="width:140px">
              <label for="temp">Temperatura (ºC)</label>
              <input id="temp" type="number" step="0.1" placeholder="ex: 38.5" />
            </div>
          </div>

          <div class="checkboxes" style="margin-top:6px">
              <label><input type="checkbox" name="fev" value="sinal_perigo_geral"> Qualquer sinal geral de perigo</label>
              <label><input type="checkbox" name="fev" value="rigidez_nuca"> Rigidez de nuca</label>
              <label><input type="checkbox" name="fev" value="petequias"> Petéquias</label>
              <label><input type="checkbox" name="fev" value="fontanela_abaulada"> Abaulamento de fontanela</label>
              <label><input type="checkbox" name="fev" value="nenhum_sinal_grave"> Nenhum sinal de malária grave ou doença febril muito grave e gota espessa ou teste rápido positivo</label>
              <label><input type="checkbox" name="fev" value="nenhum_sinal_negativo"> Nenhum sinal de doença febril muito grave.</label>
              <label><input type="checkbox" name="fev" value="area_risco"> Área com risco de malária</label>
          </div>

          <h3>Problema de ouvido</h3>
          <div class="checkboxes">
              <label><input type="checkbox" name="ear" value="tumefacao_vermelhidao"> Tumefação e/ou vermelhidão dolorosa ao toque atrás da orelha</label>
              <label><input type="checkbox" name="ear" value="secrecao_menos_14"> Secreção purulenta visível no ouvido há menos de 14 dias ou otoscopia alterada</label>
              <label><input type="checkbox" name="ear" value="secrecao_14_ou_mais"> Secreção purulenta visível no ouvido há 14 dias ou mais</label>
              <label><input type="checkbox" name="ear" value="sem_dor_sem_secrecao"> Não tem dor de ouvido e não foi notada alguma secreção purulenta no ouvido</label>
              <label><input type="checkbox" name="ear" value="dor_ouvido"> Dor no ouvido</label>
          </div>

          <h3>Dor de garganta</h3>
          <div class="checkboxes">
              <label><input type="checkbox" name="throat" value="sinal_perigo_geral"> Qualquer sinal geral de perigo</label>
              <label><input type="checkbox" name="throat" value="amigdalas_membranas"> Amígdalas com a presença de membranas branco-acinzentadas.</label>
              <label><input type="checkbox" name="throat" value="ganglios_dolorosos"> Gânglios aumentados e dolorosos no pescoço.</label>
              <label><input type="checkbox" name="throat" value="amigdalas_pontos_purulentos"> Amígdalas hiperemiadas com pontos purulentos ou petéquias em palato.</label>
              <label><input type="checkbox" name="throat" value="vesiculas_hiperemia_resfriado"> Vesículas ou hiperemia de garganta, associados a sinais de resfriado comum.</label>
              <label><input type="checkbox" name="throat" value="nenhum_sinal"> Não há nenhum dos sinais acima descritos.</label>
              <label><input type="checkbox" name="throat" value="abaulamento_palato"> Abaulamento de palato.</label>
          </div>

          <h3>Nutrição e anemia</h3>
          <div class="checkboxes">
              <label><input type="checkbox" name="nut" value="emagrecimento_acentuado"> Emagrecimento acentuado visível</label>
              <label><input type="checkbox" name="nut" value="edema_ambos_pes"> Edema em ambos os pés.</label>
              <label><input type="checkbox" name="nut" value="peso_idade_menor_menos3"> Peso para a idade &lt;-3 escores z.</label>
              <label><input type="checkbox" name="nut" value="peso_idade_menor_menos2"> Peso para a idade &lt;-2 e ≥-3 escores z.</label>
              <label><input type="checkbox" name="nut" value="tendencia_curva_descendente"> Tendência da curva peso/idade horizontal ou descendente.</label>
              <label><input type="checkbox" name="nut" value="peso_idade_maior_mais2"> Peso para a idade &gt;+2 escores z.</label>
              <label><input type="checkbox" name="nut" value="peso_idade_entre_menos2_mais2"> Peso para a idade ≥-2 e ≤+2 escores z.</label>
              <label><input type="checkbox" name="nut" value="palidez_palmar_grave"> Palidez palmar grave ou Hb abaixo de 5 g/dL.</label>
              <label><input type="checkbox" name="nut" value="palidez_palmar_leve"> Palidez palmar leve ou Hb de 5 g/dL a 10,9 g/dL.</label>
          </div>

          <label style="margin-top:10px">Observações / conduta já tomada (opcional)</label>
          <textarea id="obs" rows="4" placeholder="Anotações rápidas, medicamentos administrados, orientações..."></textarea>

          <div class="actions">
            <button class="btn" id="evaluateBtn" type="button">Avaliar</button>
            <button class="btn ghost" id="saveBtn" type="button">Salvar no navegador</button>
            <button class="btn ghost" id="downloadBtn" type="button">Baixar resumo</button>
            <button class="btn ghost" type="btn-voltar" onclick="window.location.href='index.html'">Voltar</button>
          </div>

          <div id="resultArea" style="display:none" class="muted-box">
            <div class="result">
              <div id="badge" class="badge">--</div>
              <div style="margin-left:12px">
                <div id="classificationText" style="font-weight:700">Classificação: --</div>
                <div id="advice" class="small">Conselho/conduta aparecerá aqui.</div>
              </div>
            </div>
          </div>

        </form>
        
      </div>
      
    </section>
  </main>
</body>
</html>
