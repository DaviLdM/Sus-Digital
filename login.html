<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - PET Saúde Digital</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="container">

    <section class="card" style="max-width:500px;margin:50px auto">

      <h2>Entrar</h2>

      <div style="margin-bottom:15px">
        <label>Email</label>
        <input
          type="email"
          id="email"
          placeholder="Digite seu email"
        >
      </div>

      <div style="margin-bottom:15px">
        <label>Senha</label>
        <input
          type="password"
          id="senha"
          placeholder="Digite sua senha"
        >
      </div>

      <div class="actions">

        <button
          class="btn"
          id="loginBtn"
          type="button"
        >
          Entrar
        </button>

        <button
          class="btn ghost"
          id="cadastroBtn"
          type="button"
        >
          Criar conta
        </button>

      </div>

      <p id="mensagem"></p>

    </section>

  </main>

  <script type="module" src="js/auth.js"></script>

</body>
</html>
