<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Login - suAIDPI</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">

  <main class="login-container">

    <section class="login-card">

      <h1>Entrar</h1>

      <form id="loginForm">

        <div class="login-field">
          <label for="email">
            E-mail
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            required
          >
        </div>

        <div class="login-field">
          <label for="senha">
            Senha
          </label>

          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="recuperar-senha-container">
          <button
            type="button"
            id="recuperarSenhaBtn"
            class="recuperar-senha-btn"
          >
            Esqueci minha senha
          </button>
        </div>

        <div class="login-actions">

          <button
            type="submit"
            id="loginBtn"
            class="login-submit"
          >
            Entrar
          </button>

          <a
            href="index.html"
            class="login-voltar"
          >
            Voltar à página inicial
          </a>

        </div>

        <p
          id="mensagem"
          class="login-message"
          role="alert"
          aria-live="polite"
        ></p>

      </form>

    </section>

  </main>

  <script
    type="module"
    src="js/auth.js"
  ></script>

</body>
</html>
